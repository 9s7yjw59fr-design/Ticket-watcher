# Ticket watcher config. Edit this file, not the code. All times are Tallinn time.

settings:
  paused: true                # stays true until calibration is done
  add_to_basket: false        # switch to true only after calibration
  normal_interval_min: 10
  near_show_interval_min: 5
  near_show_hours: 48
  burst_interval_s: 30
  delay_seconds: [3, 7]
  preferred_days: [Thu, Fri, Sat]   # alerts for other days come marked as "other day"
  tickets: 2

platforms:
  linnateater:                # theatre's own schedule pages; tickets sold via Piletilevi
    sold_out_texts: ["välja müüdud", "sold out"]
    buy_selector: "text=/Osta pilet|Buy ticket/i"
    login_steps: []
    basket_steps: []
    checkout_url: "https://www.piletilevi.ee"

  draamateater:               # theatre's own production pages; tickets sold via Piletimaailm
    sold_out_texts: ["välja müüdud", "sold out"]
    buy_selector: "text=/Osta|Buy/i"
    login_steps: []
    basket_steps: []
    checkout_url: "https://www.piletimaailm.com"

watches:
  - name: "Linnateater - Iphigeneia. Agamemnon. Elektra."
    platform: linnateater
    tickets: 2
    urls: ["https://linnateater.ee/en/schedule/?filter=production&value=15943"]

  - name: "Linnateater - Night (Öö, Jaan Tätte)"
    platform: linnateater
    tickets: 2
    urls: ["https://linnateater.ee/en/schedule/?filter=production&value=19981"]

  - name: "Linnateater - Krum"
    platform: linnateater
    tickets: 2
    urls: ["https://linnateater.ee/en/schedule/?filter=production&value=13972"]

  - name: "Draamateater - Rahamaa (Business As Usual)"
    platform: draamateater
    tickets: 2
    urls: ["https://www.draamateater.ee/en/lavastus/rahamaa/"]

  - name: "Draamateater - Prima facie"
    platform: draamateater
    tickets: 2
    urls: ["https://www.draamateater.ee/en/lavastus/prima-facie/"]

sale_openings: []
  # Example, added when a new ticket block is announced:
  # - opens: "2027-01-04T10:00"
  #   platform: draamateater
  #   duration_min: 30
