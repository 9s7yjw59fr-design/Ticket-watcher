# Ticket watcher config. Edit this file, not the code. All times are Tallinn time.

settings:
  paused: false
  tickets: 2
  preferred_days: [Thu, Fri, Sat]   # alerts say "Thu-Sat" or "other day"
  normal_interval_min: 10
  near_show_interval_min: 5
  near_show_hours: 48
  burst_interval_s: 30
  delay_seconds: [2, 5]

watches:
  # Linnateater: one schedule page lists all productions; "match" picks ours by title.
  - name: "Linnateater - Iphigeneia. Agamemnon. Elektra."
    theatre: linnateater
    url: "https://linnateater.ee/en/schedule/"
    match: ["agamemnon"]

  - name: "Linnateater - Öö (Night)"
    theatre: linnateater
    url: "https://linnateater.ee/en/schedule/"
    match_exact: ["öö"]

  - name: "Linnateater - Krum"
    theatre: linnateater
    url: "https://linnateater.ee/en/schedule/"
    match: ["krum"]

  - name: "Linnateater - Uskuja (The Christians)"
    theatre: linnateater
    url: "https://linnateater.ee/en/schedule/"
    match: ["christians", "uskuja"]

  # Draamateater: each production page lists its dates with a Buy link or Sold out.
  - name: "Draamateater - Rahamaa"
    theatre: draamateater
    url: "https://www.draamateater.ee/en/lavastus/rahamaa/"

  - name: "Draamateater - Prima facie"
    theatre: draamateater
    url: "https://www.draamateater.ee/en/lavastus/prima-facie/"

  - name: "Draamateater - Ükskord Liibanonis"
    theatre: draamateater
    url: "https://www.draamateater.ee/en/lavastus/ukskord-liibanonis/"

  - name: "Draamateater - Lehman Brothers"
    theatre: draamateater
    url: "https://www.draamateater.ee/en/lavastus/lehman-brothers/"

  - name: "Draamateater - Hamlet"
    theatre: draamateater
    url: "https://www.draamateater.ee/en/lavastus/hamlet/"

  - name: "Draamateater - Eneseabiõpik"
    theatre: draamateater
    url: "https://www.draamateater.ee/en/lavastus/eneseabiopik/"

sale_openings: []
  # Added when a new ticket block is announced, e.g.:
  # - opens: "2027-01-04T10:00"
  #   theatre: draamateater
  #   duration_min: 30
  #   url: "https://www.draamateater.ee/en/mangukava/"
